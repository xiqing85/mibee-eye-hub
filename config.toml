[web]
port = 8443
host = "0.0.0.0"
# Optional additional plain-HTTP listener (no TLS cert warning in browsers).
# 0 = disabled. Session cookies issued over this port omit the `Secure` flag.
http_port = 8088
# Hostname/IP advertised in stream URLs returned to clients (RTSP/ONVIF/Snapshot).
# Empty = auto-detect LAN IP at startup via UDP probe.
# Set this explicitly when behind NAT or if auto-detection picks the wrong interface.
advertised_host = ""

[rtsp]
server_port = 8554


[capture]
video_device = "/dev/video0"
audio_device = "default"

[security]
rate_limit_max = 20
rate_limit_window_secs = 60

[observability]
# OTLP trace exporter endpoint (gRPC). Empty by default — set to your
# collector's address (e.g. "http://localhost:4317") to enable tracing.
# Leaving this empty avoids the BatchSpanProcessor busy-looping when no
# collector is reachable (default-OFF per the project's outbound policy).
otel_endpoint = ""
log_level = "info"

# ---------------------------------------------------------------------------
# Remote log shipping (Loki-compatible HTTP endpoint)
# Uncomment the lines below to enable shipping structured logs to a remote
# Loki-compatible backend (e.g. Grafana Loki, VictoriaMetrics/vm-logs).
#
# This is an OPTIONAL feature — the app works fine without it. When enabled,
# logs are shipped in addition to stdout/stderr. Network errors are logged as
# warnings and do not crash the application (fail-open).
# ---------------------------------------------------------------------------
# [observability.logs]
# endpoint = "http://loki:3100"
# batch_size = 100
# flush_interval_secs = 5
# labels = { service = "mibee-eye" }
[onvif]
enabled = false
device_name = "mibee-eye"
manufacturer = "MiBee"
model = "Rec-01"
serial = "NC00000001"
firmware_version = "1.0.0"

[gb28181]
enabled = false
platform_sip_address = "192.168.1.100"
platform_sip_port = 5060
device_id = "34020000002000000001"
username = ""
password = ""
sip_domain = "3402000000"
register_interval_secs = 60
heartbeat_interval_secs = 60
heartbeat_timeout_count = 3
channel_id = "34020000001320000001"
local_sip_port = 5060

[rtmp_push]
enabled = false
push_url = "rtmp://192.168.1.100:1935/live"
app_name = "live"
stream_name = "stream1"
reconnect_interval_secs = 5
max_reconnect_attempts = 10

[recording]
# Master enable toggle. When true, all streams auto-record to MP4 segments.
# Individual recording parameters (path, segment duration, capacity) below.
enabled = false
# Directory where MP4 segment files are written. Must exist and be writable.
path = "./recordings"
# MP4 segment duration in seconds (each file covers this much video).
segment_duration_secs = 900
# Max total capacity in megabytes. 0 = unlimited (no auto-pruning).
# When exceeded, oldest segments are deleted first (FIFO).
max_capacity_mb = 10240

# Video watermark (SPEC v1 §5.2) — bootstrap default only; runtime config is
# persisted in the DB as protocols.watermark (editable via Web UI, applies at
# the next camera stream (re)start). Burned into every video output (live /
# RTSP / MSE / recordings / snapshots), white text + 1px black outline.
[watermark]
enabled = false
# Custom text (≤128 chars; CJK needs font_path pointing at a CJK font).
text = ""
# Real-time clock next to the text (device local timezone).
show_timestamp = true
# strftime subset: %Y %m %d %H %M %S %F %T %% plus literals.
timestamp_format = "%Y-%m-%d %H:%M:%S"
# top-left | top-right | bottom-left | bottom-right
position = "top-left"
# Font height in pixels (12..96).
font_size = 24
# Optional TTF/OTF for non-ASCII text; empty = built-in ASCII font.
font_path = ""

[ai]
# On-device AI object detection (NanoDet-Plus 320, COCO 80 classes) — the
# same model and semantics as the raspi cameras (SPEC v1 §4.6).
# Off by default, like the outbound protocols. When enabled:
#   - the model is loaded once at startup (fail-open: a missing model or
#     libonnxruntime.so just leaves AI disabled, logged in the startup log);
#   - each started camera stream gets a detection worker that taps the JPEG
#     preview (never the capture/encode path);
#   - results appear in the web UI overlay, GET /api/detections and
#     ai_detection SSE events.
# libonnxruntime.so is located via the ORT_DYLIB_PATH environment variable
# or the system library path.
enabled = false
model_path = "models/nanodet-m.onnx"
confidence_threshold = 0.5
interval_ms = 1000

# ─────────────────────────────────────────────────────────────────────────────
# On-device sound-event detection (YAMNet + Silero VAD, `[audio_ai]`).
# Off by default — the microphone is privacy-sensitive input, so continuous
# listening is opt-in. Fired events ride the `alarm` SSE event with
# source:"audio" (plus class/score) and the GB28181 Alarm NOTIFY, exactly
# like visual alarms. Requires ONNX Runtime at run time (like `[ai]`).
[audio_ai]
enabled = false
# device = "default"   # input device name substring
# classes = ["Dog","Bark","Yip","Howl","Bow-wow","Baby cry, infant cry","Screaming","Shout","Glass","Shatter","Breaking","Smoke detector, smoke alarm","Fire alarm","Siren","Knock"]
# threshold = 0.3      # voted score (mean of 3 windows) needed to fire
# cooldown_secs = 30   # per-class cooldown
# model_path = "models/audio/yamnet.onnx"
# vad_model_path = "models/audio/silero_vad.onnx"

# ─────────────────────────────────────────────────────────────────────────────
# On-device OCR (PP-OCRv5 mobile, `[ocr]`). Off by default. When enabled,
# POST a JPEG to /api/ocr to recognize text (Chinese + English) in it.
[ocr]
enabled = false
# det_path = "models/ocr/ch_PP-OCRv4_det_infer.onnx"
# rec_path = "models/ocr/ppocrv5_mobile_rec.onnx"
# dict_path = "models/ocr/ppocrv5_dict.txt"
# max_side = 960
# det_threshold = 0.3

# ─────────────────────────────────────────────────────────────────────────────
# Voice interaction (`[voice]`): wake word (sherpa-onnx KWS zipformer,
# keywords.txt — "小蜜蜂" appended by default) + offline transcription of
# the utterance that follows (paraformer zh int8). Off by default and
# requires a binary built with the `voice` feature. Completed interactions
# are reported as SSE `voice_transcript` events.
[voice]
enabled = false
# kws_encoder = "models/voice/kws/encoder.int8.onnx"
# kws_decoder = "models/voice/kws/decoder.int8.onnx"
# kws_joiner = "models/voice/kws/joiner.int8.onnx"
# kws_tokens = "models/voice/kws/tokens.txt"
# keywords_file = "models/voice/kws/keywords.txt"
# keywords_threshold = 0.25
# keywords_score = 1.0
# paraformer_model = "models/voice/paraformer/model.int8.onnx"
# paraformer_tokens = "models/voice/paraformer/tokens.txt"
# capture_secs = 4
# num_threads = 1

# ─────────────────────────────────────────────────────────────────────────────
# Local LLM dialogue (`[llm]`, llama.cpp + Qwen3 GGUF). Off by default and
# requires a binary built with the `llm` feature. Serves POST /api/chat and
# answers voice interactions when both are enabled.
[llm]
enabled = false
# model_path = "models/llm/Qwen3.5-4B-Q4_K_M.gguf"
# model_path_mid = "models/llm/Qwen3.5-2B-Q4_K_M.gguf"
# n_ctx = 1024
# n_threads = 2
# max_tokens = 200
# no_think = true

# ─────────────────────────────────────────────────────────────────────────────
# TTS playback (`[tts]`): the sherpa-onnx-offline-tts CLI as a subprocess
# (keeps the GPL espeak-ng link out of this binary). Speaks LLM replies
# when voice + llm + tts are all enabled. Off by default.
[tts]
enabled = false
# binary = "tmp/sherpa-libs/tools-bin/bin/sherpa-onnx-offline-tts"
# model = "models/voice/melo/model.onnx"
# lexicon = "models/voice/melo/lexicon.txt"
# tokens = "models/voice/melo/tokens.txt"
# dict_dir = "models/voice/melo/dict"
# rule_fsts = "models/voice/melo/number.fst,models/voice/melo/date.fst"
# player = "aplay -q"

# Alarm-image descriptions (SPEC appendix A #23): when a visual alarm
# fires, the triggering frame is described by Qwen3-VL and the sentence
# arrives as an `alarm_description` SSE event. Event-triggered, never
# polled; the alarm itself never waits for the description. Requires a
# `vlm`-feature build and an AVX2-class CPU (llama.cpp GGML kernels) —
# on weaker hosts leave disabled (fail-open).
# Decision triage over voice transcripts (Laya typed decisions, SPEC
# appendix A #26). Requires the [ai] runtime (onnxruntime); off by default.
[decision]
enabled = false
# model_path = "models/decision/laya_multilingual.int8.onnx"
# tokenizer_path = "models/decision/tokenizer.json"
# config_path = "models/decision/laya_config.json"
# min_confidence = 0.35
# num_threads = 1

[meeting]
# On-demand meeting mode (SPEC appendix A #27): explicit start → stop
# recording sessions, then offline diarization + per-segment ASR.
# Nothing is recorded outside a session. Requires the [voice] ASR models.
enabled = false
# segmentation_model = "models/voice/diarization/pyannote.onnx"
# punctuation_model = "models/voice/punct/model.onnx"
# clustering_threshold = 0.5
# keep_audio = false
# max_duration_secs = 7200
# audio_dir = "meetings"
# num_threads = 1

[vlm]
enabled = false
# Qwen3.5 ships a vision encoder in every size — one unified GGUF serves
# both [llm] and [vlm] (weights are mmap-shared between the engines).
# model_path = "models/llm/Qwen3.5-4B-Q4_K_M.gguf"
# mmproj_path = "models/vlm/mmproj-qwen3.5-4b-F16.gguf"
# n_ctx = 2048
# n_threads = 2
# max_tokens = 100
# repeat_penalty = 1.1   # 重复惩罚（1.0 关闭）——贪心解码在困难帧上会循环列举，需要它
# prompt = "这是安防摄像头的告警画面。请用一句中文描述画面里发生了什么。"

# ─────────────────────────────────────────────────────────────────────────────
# Boot-time resource adaptation (`[resources]`, SPEC appendix A #40).
# `feature_gate = "auto"` (default) admits enabled AI features greedily
# against the boot memory budget (MemAvailable − reserve_mib) in priority
# order (ai → audio_ai → voice → llm → tts → decision → face → ocr →
# meeting → vlm), shedding the heaviest tail on small-memory hosts;
# `"all"` boots every enabled feature regardless (legacy behaviour).
# Each feature's cost is estimated from its model files on disk, so the
# decision follows what is actually deployed. Re-evaluated on restart.
# `auto_tier` (#30-E) additionally picks the LLM model file by available
# memory (full ≥8 GiB / mid ≥4 GiB / lite below).
[resources]
# feature_gate = "auto"
# reserve_mib = 512
# auto_tier = false

# ─────────────────────────────────────────────────────────────────────────────
# Conversation records (`[conversations]`, SPEC §3.4): the human-readable
# dialogue turn log — heard/input text, internal "thinking" entries (one
# per model call or routing decision, failed fallback legs included) and
# the AI reply with its engine. Persisted in SQLite (FIFO, newest 1000
# turns), served at GET /api/conversations + live SSE `conversation`
# events, shown in the assistant page "Conversation Log" card. Set
# enabled = false to record nothing and hide the card (privacy switch).
[conversations]
# enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# Desktop integration (`[desktop]`, SPEC appendix A #42): tray icon +
# desktop notifications when the service runs on a Linux host WITH a
# desktop session. All fail-open — a headless server skips everything
# with one log line and behaves exactly as before.
# - tray: StatusNotifierItem icon; left-click or menu opens the web UI
#   (xdg-open; prefers web.http_port when set, else the TLS port).
# - notifications: desktop notification on every accepted alarm rising
#   edge (visual "检测到 N 个目标" / sound "听到：Dog" / zone events).
# - notify_conversations: also notify when a voice reply completes
#   (body = reply excerpt). Off by default — the reply is already spoken.
[desktop]
# tray = true
# notifications = true
# notify_conversations = false

# ─────────────────────────────────────────────────────────────────────────────
# Away mode (`[away]`, SPEC §3.6): armed watch over the live AI detections.
# Cadence stacks on [ai] interval_ms; person arrivals (gap + cooldown
# gated) are greeted + asked; pets/other configured labels are recorded.
[away]
interval_ms = 1000
person_gap_secs = 10
greeting_cooldown_secs = 120
activity_cooldown_secs = 60
activity_labels = ["cat", "dog", "bird"]
listen_secs = 10
snapshot_dir = "away-snapshots"
greeting_known = "欢迎回家，{name}。"
greeting_unknown = "你好，这里是主人的智能看家助手。主人现在不在家，请问你是谁？"
# Runtime knobs below are web-configurable live via PUT /api/config
# (scene.away.*) — TOML here only seeds the boot defaults.
voice_control = true
summary_on_disarm = true
deterrence = false
deterrence_text = "请注意：您的影像和声音已被记录，主人将收到通知。"
reask_text = "请问你是谁？请说明来意。"
schedule_arm = ""            # "HH:MM" local; empty = off
schedule_disarm = ""         # "HH:MM" local; empty = off
schedule_weekdays_only = false
push_url = ""                # visitor push webhook; empty = zero egress
audio_link = true

# Agent tools & skills (`[agent]`, SPEC §3.5 / appendix A #43): the
# dialogue assistant's tool-calling loop. Built-in tools (time.now /
# weather.current / camera.snapshot) are always registered; custom
# plugins plug in as MCP (Model Context Protocol, 2025-06-18) stdio
# subprocess servers. Empty registry = plain dialogue, zero change.
[agent]
# enabled = true
# max_steps = 3            # tool-call iterations before forcing a text answer
# step_timeout_ms = 15000  # per tool execution timeout
#
# Custom tool plugin example (any MCP stdio server):
# [[agent.mcp_servers]]
# name = "home"
# command = "python3"
# args = ["/home/mickey/.config/mibee-eye/mcp/home_tools.py"]
# env = { }
