name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev libasound2-dev libclang-dev
      - run: cargo ci-clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev libasound2-dev libclang-dev
      - run: cargo test --workspace

  coverage:
    # 覆盖率棘轮（mibee-rec #6 M1 · 开发规范：85% 下限、93% 目标）。
    # 基线在 tools/coverage-baseline.txt，只升不降（--update 棘轮上调）；
    # 新模块 ≥85% 起步由评审执行。口径 = --workspace --lib 默认 feature，
    # feature 门控模块（ocr/webrtc/mse/faces 等）的执行面在 feature-matrix
    # job，本口径下计 0 不换算。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev libasound2-dev libclang-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: tools/check-coverage.sh

  feature-matrix:
    # 跨 feature 编译面（AI 扩展规划横切项）：接口改动必须全矩阵过
    # 一遍。voice+llm 腿抓跨 feature 静态初始化回归（e02c2a6 一类）。
    # 注意 workspace 级 --no-default-features 不传导给成员 crate 的
    # 默认特性，no-ai 腿须按 -p streaming 指定。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-ai
            flags: "-p streaming --no-default-features"
          - name: voice
            flags: "--features voice"
            sherpa: true
          - name: llm
            flags: "--features llm"
          - name: voice-plus-llm
            flags: "--features voice,llm"
            sherpa: true
          - name: vlm
            flags: "--features vlm"
    name: feature-matrix (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libv4l-dev libasound2-dev libclang-dev
      - name: Fetch sherpa-onnx static libs
        if: matrix.sherpa
        run: |
          curl -sSfL -o /tmp/sherpa.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-static-lib.tar.bz2
          mkdir -p tmp/sherpa-libs
          tar -xjf /tmp/sherpa.tar.bz2 -C tmp/sherpa-libs
      - name: cargo check
        run: cargo check --all-targets ${{ matrix.flags }}
        env:
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/tmp/sherpa-libs/sherpa-onnx-v1.13.8-linux-x64-static-lib/lib
      - name: cargo test
        # Until 2026-10-15 this job only ran `cargo check`. Every
        # feature-gated module — the whole voice bridge (wake word → ASR →
        # decision → LLM → TTS pipeline), the tool/MCP agent loop, the model
        # download manager and the VLM description layer — therefore compiled
        # in CI and was never executed once. A test that only passes on the
        # default feature set was a lie the matrix was supposed to catch.
        #
        # `--lib` per package keeps it honest about the feature flags the
        # matrix sets: the workspace-level default `test` job already covers
        # the default surface, this covers the combinations.
        run: cargo test --workspace --lib ${{ matrix.flags }} --no-fail-fast
        env:
          SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/tmp/sherpa-libs/sherpa-onnx-v1.13.8-linux-x64-static-lib/lib

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene gate (junk/secret files must not be tracked)
        run: tools/check-repo-hygiene.sh

  hardcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded-value gate (configurable values must come from config)
        run: tools/check-hardcode.sh

  identity:
    # 身份门禁（2026-09-27）：公开历史只允许已验证的 xiqing85 noreply 身份
    # （324791119）。捏造的 noreply 数字 ID 曾把陌生账号挂上贡献者列表。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity allowlist (verified xiqing85 noreply only)
        run: |
          ok="324791119+xiqing85@users.noreply.github.com"
          viol=$(git log --format="%ae%n%(trailers:key=Co-authored-by,valueonly)" \
            | grep -oE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+" | sort -u \
            | grep -vxF -e "$ok" -e "xiqing85@users.noreply.github.com" || true)
          violc=$(git log --format="%ce" \
            | grep -oE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+" | sort -u \
            | grep -vxF -e "$ok" -e "xiqing85@users.noreply.github.com" -e "noreply@github.com" || true)
          if [ -n "$viol$violc" ]; then
            echo "::error::Non-allowlisted identity emails — author/trailer [$viol] committer [$violc]"
            exit 1
          fi
