[package]
name = "streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Enable AAC audio encoding (required for RTMP audio + standards-compliant MP4
# audio). Off by default — G.711 μ-law is the default audio codec, which works
# for RTSP but is non-compliant for RTMP/MP4.
default = ["ai"]
aac = ["dep:fdk-aac"]
# On-device AI object detection (NanoDet-Plus via ONNX Runtime). On by default
# so deployed binaries are AI-capable; the feature itself is opt-in via the
# `[ai]` config section. `ort` uses load-dynamic — libonnxruntime.so is only
# needed at run time when `[ai] enabled = true`.
ai = ["dep:ort", "dep:tokenizers"]
# Enable Intel/AMD hardware H.264 encoding via libva (VAAPI). Requires libva at
# build/run time. Off by default — the software (OpenH264) path is always built.
vaapi = []
# Voice interaction (wake word + offline ASR via sherpa-onnx). Requires
# the sherpa-onnx static libs at build time (SHERPA_ONNX_LIB_DIR); off by
# default so default builds and CI need nothing extra.
voice = ["dep:sherpa-onnx"]
# Local LLM dialogue (llama.cpp via llama-cpp-2). Builds llama.cpp from
# source — significant compile time, off by default.
llm = ["dep:llama-cpp-2"]
# Alarm-image description (Qwen3-VL via llama.cpp mtmd). Implies `llm`
# and turns on the multimodal support in llama-cpp-2.
vlm = ["llm", "llama-cpp-2/mtmd"]
# Enable NVIDIA hardware H.264 encoding via NVENC. Requires the NVIDIA Codec
# SDK at build time and a proprietary driver at run time. Off by default.
nvenc = []
# Use libjpeg-turbo (via the `turbojpeg` crate) for MJPEG decoding instead of
# the pure-Rust `jpeg-decoder`. ~2-6× faster on x86_64 thanks to SIMD. The
# default build stays on jpeg-decoder to avoid the libturbojpeg0 run-time
# system dependency; enable this when libturbojpeg0 is present on the target.
turbojpeg = ["dep:turbojpeg"]

[dependencies]
libc = "0.2"
pinyin = { version = "0.10", features = ["with_tone"] }
capture = { path = "../capture" }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
opentelemetry.workspace = true
uuid.workspace = true
protocols = { path = "../protocols" }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
fontdue.workspace = true
schemars.workspace = true
futures = "0.3"
cpal.workspace = true
parking_lot = "0.12"
observability = { path = "../observability" }
# Native codec stack (ffmpeg replacement)
openh264.workspace = true
jpeg-decoder.workspace = true
jpeg-encoder.workspace = true
muxide.workspace = true
fdk-aac = { workspace = true, optional = true }
turbojpeg = { version = "1.0", optional = true }
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic"] }
# HuggingFace tokenizer (Rust) for the Laya decision checkpoint — pure-Rust
# loading of tokenizer.json, no Python in sight.
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
sherpa-onnx = { version = "=1.13.8", optional = true }
# default-features off: no openmp (the statically linked sherpa-onnx
# already embeds its own OpenMP runtime — two static OpenMP copies in one
# binary corrupt each other's init and abort with bad_alloc).
llama-cpp-2 = { version = "=0.1.160", optional = true, default-features = false }

[dev-dependencies]
axum.workspace = true
toml.workspace = true
http = "1"
bytes = "1"
