[workspace]
resolver = "2"
members = [
    "crates/capture",
    "crates/protocols",
    "crates/streaming",
    "crates/web",
    "crates/security",
    "crates/observability",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
description = "Professional laptop surveillance agent"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# ONVIF Device stack — 0.9.0: server half unchanged; the release also
# carries the new client half (unused here). Same content as the old
# 02228fd git pin plus the client packages.
onvif-device-rs = "0.9.0"
# GB/T 28181 device stack — 0.13.0: the transport-parity package
# (pagination, negotiated expiry, silence handling, stream transports,
# passive TCP media, five-query seam, multicast) on top of the v0.12.0
# closure package.
gb28181-rs = { version = "0.13.0", features = ["gb35114"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-prometheus = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prometheus = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
bcrypt = "0.17"
rand = "0.8"
nokhwa = { version = "0.10", features = ["input-native"] }
cpal = "0.18"
# ── Native codec stack (replaces ffmpeg subprocesses) ────────────────────────
# H.264 software encoder (Cisco BSD-2, vendored C++ compiled via cc/build.rs).
# `source` feature bundles a prebuilt Cisco library blob for the host target,
# avoiding the need to ship/locate libopenh264.so at runtime.
openh264 = { version = "0.9", features = ["source"] }
# JPEG decode (camera MJPG → pixels) and encode (YUYV cameras → JPEG preview).
jpeg-decoder = "0.3"
jpeg-encoder = "0.7"
# Pure-Rust MP4 (fMP4) muxer for local recording segment archive.
muxide = "0.2"
# Optional AAC encoder for RTMP audio compliance. The `optional = true` is
# declared at the consumer (streaming crate) level, not here — workspace
# deps don't support `optional`.
fdk-aac = "0.8"
rcgen = "0.14"
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-core = "0.3"
base64 = "0.22"
libc = "0.2"
parking_lot = "0.12"
udev = "0.9"
schemars = { version = "0.8", features = ["chrono"] }
# Video watermark (SPEC v1 §5.2): pure-Rust font rasterizer + local-time clock.
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Desktop integration (SPEC appendix A #42): tray via StatusNotifierItem and
# notifications via org.freedesktop.Notifications — both pure-Rust zbus, no
# libdbus C library (headless hosts just lack a session bus → fail-open).
ksni = "0.3"
notify-rust = { version = "4", default-features = false, features = ["z"] }

[package]
name = "mibee-eye"
version = "0.4.0"
edition = "2024"
license.workspace = true
description = "Professional laptop surveillance agent"
rust-version = "1.88"

[features]
voice = ["streaming/voice"]
llm = ["streaming/llm"]
vlm = ["streaming/vlm"]

[dependencies]
# web-server deps struct names the auth connection type (security keeps it private).
rusqlite.workspace = true
# plugin schedule tick local-time edges (same clock as the away scheduler).
chrono.workspace = true
tokio.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json.workspace = true
protocols = { path = "crates/protocols" }
gb28181-rs.workspace = true
onvif-device-rs.workspace = true
observability = { path = "crates/observability" }
web = { path = "crates/web" }
security = { path = "crates/security" }
rustls.workspace = true

streaming = { path = "crates/streaming" }
sqlx.workspace = true
capture = { path = "crates/capture" }
dirs = "6"
libc.workspace = true
ksni.workspace = true
notify-rust.workspace = true
